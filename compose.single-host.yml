# Self-contained preview for a small Linux host; no shared_gateway is required.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ai-interview-backend:single-host
  build:
    context: ./ai-interview-backend
  env_file: .env
  environment:
    API_PORT: "8001"
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *backend
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    volumes:
      - uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      default:
        aliases: [ai-interview-app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/config/health', timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s

  celery-worker:
    <<: *backend
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--pool=solo", "--concurrency=1", "-Q", "celery,scheduled_tasks"]
    volumes:
      - uploads:/app/uploads
      - app_logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    # Override the API-specific HEALTHCHECK inherited from the backend image.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q OK"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    <<: *backend
    profiles: [scheduler]
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--schedule", "/app/celerybeat-schedule/celerybeat-schedule.db"]
    volumes:
      - celerybeat_data:/app/celerybeat-schedule
      - app_logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    image: ai-interview-frontend:single-host
    build:
      context: ./ai-interview-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging

  admin:
    image: ai-interview-admin:single-host
    build:
      context: ./ai-interview-admin
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${ADMIN_HTTP_PORT:-8081}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  uploads:
  app_logs:
  celerybeat_data:
